<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Geo Engine — Lagos Dashboard</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      color: #e8e8e8;
      font-family: 'Courier New', monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      border-bottom: 1px solid #1e1e1e;
      background: #0a0a0a;
      z-index: 1000;
    }

    .logo {
      font-size: 13px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #e8e8e8;
    }

    .logo span {
      color: #f97316;
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 11px;
      color: #555;
      letter-spacing: 0.1em;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #333;
      display: inline-block;
      margin-right: 6px;
      transition: background 0.3s;
    }

    .status-dot.connected { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
    .status-dot.disconnected { background: #ef4444; }

    #map {
      flex: 1;
      width: 100%;
    }

    /* Leaflet dark tile override */
    .leaflet-tile {
      filter: brightness(0.55) saturate(0.4) hue-rotate(190deg);
    }

    .leaflet-container {
      background: #0a0a0a;
    }

    /* Rider marker */
    .rider-marker {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #f97316;
      border: 2px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: bold;
      color: #000;
      font-family: 'Courier New', monospace;
      letter-spacing: 0;
      box-shadow: 0 0 12px rgba(249, 115, 22, 0.5);
      transition: transform 0.3s ease;
    }

    .rider-marker.unavailable {
      background: #555;
      box-shadow: none;
      border-color: #333;
      color: #999;
    }

    /* Popup */
    .leaflet-popup-content-wrapper {
      background: #111;
      border: 1px solid #222;
      border-radius: 4px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }

    .leaflet-popup-content {
      color: #e8e8e8;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      margin: 10px 14px;
      line-height: 1.6;
    }

    .leaflet-popup-tip {
      background: #111;
    }

    .popup-name {
      font-size: 13px;
      color: #f97316;
      margin-bottom: 4px;
    }

    .popup-status {
      color: #22c55e;
      font-size: 11px;
    }

    .popup-status.busy {
      color: #ef4444;
    }

    /* Rider count panel */
    .panel {
      position: absolute;
      bottom: 24px;
      left: 16px;
      z-index: 1000;
      background: rgba(10, 10, 10, 0.9);
      border: 1px solid #1e1e1e;
      padding: 12px 16px;
      font-size: 11px;
      letter-spacing: 0.1em;
      color: #555;
      min-width: 160px;
    }

    .panel-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 4px;
    }

    .panel-row:last-child { margin-bottom: 0; }

    .panel-value {
      color: #e8e8e8;
      font-size: 13px;
    }

    .panel-value.active { color: #22c55e; }
  </style>
</head>
<body>

<header>
  <div class="logo">GEO<span>ENGINE</span> — Lagos</div>
  <div class="status-bar">
    <div id="ws-status">
      <span class="status-dot disconnected" id="status-dot"></span>
      <span id="status-text">DISCONNECTED</span>
    </div>
    <div id="last-update" style="display:none">LAST UPDATE: <span id="update-time">—</span></div>
  </div>
</header>

<div id="map"></div>

<div class="panel">
  <div class="panel-row">
    <span>TOTAL RIDERS</span>
    <span class="panel-value" id="total-count">0</span>
  </div>
  <div class="panel-row">
    <span>AVAILABLE</span>
    <span class="panel-value active" id="available-count">0</span>
  </div>
  <div class="panel-row">
    <span>ZONE</span>
    <span class="panel-value">YABA</span>
  </div>
</div>

<script>
  // --- Map setup ---
  const map = L.map('map', {
    center: [6.525, 3.38],
    zoom: 14,
    zoomControl: false,
  });

  L.control.zoom({ position: 'bottomright' }).addTo(map);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors',
    maxZoom: 19,
  }).addTo(map);

  // --- Yaba zone polygon ---
  const yabaCoords = [
    [6.515, 3.37],
    [6.53,  3.36],
    [6.54,  3.375],
    [6.535, 3.39],
    [6.52,  3.395],
    [6.51,  3.385],
  ];

  L.polygon(yabaCoords, {
    color: '#f97316',
    fillColor: '#f97316',
    fillOpacity: 0.06,
    weight: 1.5,
    dashArray: '4 4',
  }).addTo(map).bindTooltip('YABA ZONE', {
    permanent: true,
    direction: 'center',
    className: 'zone-label',
  });

  // --- Rider markers ---
  const markerMap = new Map(); // riderId → L.marker

  function makeIcon(rider) {
    const initials = rider.name.slice(0, 2).toUpperCase();
    return L.divIcon({
      className: '',
      html: `<div class="rider-marker ${rider.isAvailable ? '' : 'unavailable'}">${initials}</div>`,
      iconSize: [32, 32],
      iconAnchor: [16, 16],
    });
  }

  function updateRiders(riders) {
    const seen = new Set();

    riders.forEach(rider => {
      seen.add(rider.id);
      const latlng = [rider.location.latitude, rider.location.longitude];

      if (markerMap.has(rider.id)) {
        // Move existing marker
        const marker = markerMap.get(rider.id);
        marker.setLatLng(latlng);
        marker.setIcon(makeIcon(rider));
      } else {
        // Create new marker
        const marker = L.marker(latlng, { icon: makeIcon(rider) })
          .addTo(map)
          .bindPopup(`
            <div class="popup-name">${rider.name}</div>
            <div>ID: ${rider.id}</div>
            <div class="popup-status ${rider.isAvailable ? '' : 'busy'}">
              ${rider.isAvailable ? '● AVAILABLE' : '● BUSY'}
            </div>
          `);
        markerMap.set(rider.id, marker);
      }
    });

    // Remove markers for riders no longer in the list
    markerMap.forEach((marker, id) => {
      if (!seen.has(id)) {
        map.removeLayer(marker);
        markerMap.delete(id);
      }
    });

    // Update panel
    document.getElementById('total-count').textContent = riders.length;
    document.getElementById('available-count').textContent =
      riders.filter(r => r.isAvailable).length;

    // Update timestamp
    const now = new Date();
    document.getElementById('update-time').textContent =
      now.toTimeString().slice(0, 8);
    document.getElementById('last-update').style.display = 'block';
  }

  // --- WebSocket ---
  const statusDot  = document.getElementById('status-dot');
  const statusText = document.getElementById('status-text');

  function connect() {
    const ws = new WebSocket(`ws://${location.host}`);

    ws.onopen = () => {
      statusDot.className  = 'status-dot connected';
      statusText.textContent = 'LIVE';
      ws.send(JSON.stringify({ type: 'dashboard' }));
    };

    ws.onmessage = (event) => {
      const message = JSON.parse(event.data);
      if (message.type === 'riders_update') {
        updateRiders(message.riders);
      }
    };

    ws.onclose = () => {
      statusDot.className  = 'status-dot disconnected';
      statusText.textContent = 'DISCONNECTED';
      // Reconnect after 2 seconds
      setTimeout(connect, 2000);
    };

    ws.onerror = () => ws.close();
  }

  connect();
</script>
</body>
</html>
